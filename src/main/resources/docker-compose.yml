version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    restart: always
    environment:
      - POSTGRES_DB=ecommerce_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:10-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ec-infra/src/main/resources/db/migration:/flyway/sql:ro
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/ecommerce_db
      - FLYWAY_USER=postgres
      - FLYWAY_PASSWORD=postgres
      - FLYWAY_CONNECT_RETRIES=60
    command: -schemas=public -baselineOnMigrate=true -connectRetries=60 migrate

  backend:
    # CHANGED: Pulling the pre-compiled image from Docker Hub instead of building from source code
    image: shawndebie/ec-backend:latest
    container_name: ec-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - QUARKUS_DATASOURCE_REACTIVE_URL=postgresql://db:5432/ecommerce_db
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/ecommerce_db
      - QUARKUS_DATASOURCE_USERNAME=postgres
      - QUARKUS_DATASOURCE_PASSWORD=postgres
      - QUARKUS_HTTP_HOST=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./ec-frontend
      dockerfile: Dockerfile.jvm
    container_name: ec-frontend
    ports:
      - "3001:3000"
    environment:
      - VITE_API_URL=https://ecapi.sdebiehome.co.za/api/graphql
      - REACT_APP_API_URL=https://ecapi.sdebiehome.co.za/api/graphql
    depends_on:
      - backend

volumes:
  db_data: