version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ecommerce-db
    restart: always
    environment:
      - POSTGRES_DB=ecommerce_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql/data

  flyway:
    image: flyway/flyway:10-alpine
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ec-infra/src/main/resources/db:/flyway/db:ro
    environment:
      - FLYWAY_URL=jdbc:postgresql://db:5432/ecommerce_db
      - FLYWAY_USER=postgres
      - FLYWAY_PASSWORD=postgres
      - FLYWAY_CONNECT_RETRIES=60
      # Schema + platform defaults + client seed. Swap the last entry to
      # deploy a different client's content.
      - FLYWAY_LOCATIONS=filesystem:/flyway/db/migration,filesystem:/flyway/db/seed/default,filesystem:/flyway/db/seed/uvh
    command: -schemas=public -baselineOnMigrate=true -baselineVersion=1.0.0 -connectRetries=60 migrate

  backend:
    image: shawndebie/ec-backend:latest
    container_name: ec-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./secrets:/deployments/secrets:ro
      # MOUNT TO WORKING DIR BINARY DIRECTORY
      - /home/sdebie/ecommerce-app/storage/images:/deployments/storage/images
    environment:
      - QUARKUS_DATASOURCE_REACTIVE_URL=postgresql://db:5432/ecommerce_db
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://db:5432/ecommerce_db
      - QUARKUS_DATASOURCE_USERNAME=postgres
      - QUARKUS_DATASOURCE_PASSWORD=postgres
      - QUARKUS_HTTP_HOST=0.0.0.0
      - CORS_ORIGINS=http://localhost:3001,http://127.0.0.1:3001,http://192.168.1.16:3001

      - SMALLRYE_JWT_SIGN_KEY_LOCATION=/deployments/secrets/privateKey.pem
      - SMALLRYE_JWT_VERIFY_KEY_LOCATION=/deployments/secrets/publicKey.pem

      # MATCH NEW PATH ABOVE
      - IMAGE_STORAGE_PATH=/deployments/storage/images
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./ec-frontend
      dockerfile: Dockerfile.jvm
    container_name: ec-frontend
    ports:
      # nginx (Dockerfile.jvm's production stage) listens on 80 inside the
      # container; these VITE_*/REACT_APP_* values are build-time-only and
      # baked into the static bundle from ec-frontend/.env, so they cannot
      # be set here as container-runtime environment vars.
      - "3001:80"
    depends_on:
      - backend

volumes:
  db_data:
