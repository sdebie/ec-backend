<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: sans-serif;
            color: #333;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid #eee;
            padding: 20px;
            border-radius: 10px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #3b82f6;
            padding-bottom: 20px;
        }

        .content {
            margin: 20px 0;
        }

        .code {
            margin: 20px 0;
            padding: 15px;
            background-color: #f9f9f9;
            border-radius: 6px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
        }

        .footer {
            font-size: 12px;
            color: #777;
            margin-top: 30px;
            text-align: center;
        }
    </style>
    <title>Password Reset Code</title>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Password Reset Code</h1>
    </div>

    <div class="content">
        <p>Use this code to reset your password. It expires in {expiresInMinutes} minutes.</p>

        <div class="code">{code}</div>

        <p>If you didn't request this, you can safely ignore this email.</p>
    </div>

    <div class="footer">
        <p>This is an automated message — please don't reply to it.</p>
    </div>
</div>
</body>
</html>
