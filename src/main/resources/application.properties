# =====================================================================
# Database Configuration (Parameterized for Docker Environment Overrides)
# =====================================================================
quarkus.datasource.db-kind=postgresql
# %dev/%prod only — leaving %test unresolved is what lets Quarkus Dev Services
# boot a throwaway Testcontainers Postgres per run (see .env's DEV_* naming).
%dev.quarkus.datasource.jdbc.url=${DEV_QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
%dev.quarkus.datasource.username=${DEV_QUARKUS_DATASOURCE_USERNAME:postgres}
%dev.quarkus.datasource.password=${DEV_QUARKUS_DATASOURCE_PASSWORD:postgres}
%prod.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL}
%prod.quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME}
%prod.quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD}
# Pool sized for one small machine running Postgres and this JVM together —
# Quarkus's own default (min=0/max=50) risks real RAM competing with the JVM
# heap, not exhaustion (Postgres allows 100, Quarkus's worker ceiling is 200+).
%prod.quarkus.datasource.jdbc.min-size=${QUARKUS_DATASOURCE_JDBC_MIN_SIZE:2}
%prod.quarkus.datasource.jdbc.max-size=${QUARKUS_DATASOURCE_JDBC_MAX_SIZE:20}
# %test's throwaway container gets schema from ec-infra's migration SQL, not
# Hibernate DDL; seed data is never referenced — tests own their own fixtures.
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.locations=classpath:db/migration
quarkus.hibernate-orm.log.sql=${LOG_SQL:false}

# =====================================================================
# Redis
# =====================================================================
# Distributed store for RateLimiterService and DistributedLockService.
# %prod only, same Dev Services reasoning as above; dev also gets a throwaway
# container (unlike Postgres) since nothing stored here needs to persist.
%prod.quarkus.redis.hosts=${REDIS_URL}
# Quarkus's own default (max-pool-size=6, max-pool-waiting=24) was never sized
# for this app — load-tested and confirmed: every checkout hits Redis for rate
# limiting, and at 600+ concurrent shoppers the queue fills and starts
# rejecting with ConnectionPoolTooBusyException. Same reasoning as the
# datasource pool above — configurable per client, modest default.
%prod.quarkus.redis.max-pool-size=${QUARKUS_REDIS_MAX_POOL_SIZE:20}
%prod.quarkus.redis.max-pool-waiting=${QUARKUS_REDIS_MAX_POOL_WAITING:50}

# =====================================================================
# HTTP Port Settings & CORS
# =====================================================================
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
# Vite's dev proxy (:3000 -> :8080) still sends a real Origin header, so dev
# needs an explicit CORS entry rather than relying on same-origin.
%dev.quarkus.http.cors.origins=http://localhost:3000
%test.quarkus.http.cors.origins=http://localhost:3000
%prod.quarkus.http.cors.origins=${CORS_ORIGINS}
quarkus.http.cors.enabled=true
quarkus.http.cors.access-control-allow-credentials=true
# Bulk image uploads can exceed the default 10 MB request limit.
quarkus.http.limits.max-body-size=100M
# Server-side proxy avoids the browser's CORS Authorization-header limits.
restcountries.api.base-url=${RESTCOUNTRIES_API_BASE_URL:https://api.restcountries.com/countries/v5}
restcountries.api.key=${RESTCOUNTRIES_API_KEY:}
# For links embedded in outbound email (password reset, wholesale decisions).
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}

# =====================================================================
# Logging
# =====================================================================
quarkus.console.color=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{node}] %-5p %t %F:%L | %m%n
# dev/test default to INFO everywhere except our own code: org.ecommerce stays
# at DEBUG (min-level=TRACE keeps it dialable to TRACE with no rebuild), so
# framework internals (Hibernate SQL/entity dumps, RESTEasy, Agroal, ...) don't
# flood the console just because root logging is verbose. prod stays INFO
# throughout — org.ecommerce gets no special-case there.
%dev.quarkus.log.min-level=DEBUG
%dev.quarkus.log.level=INFO
%dev.quarkus.log.console.level=INFO
%dev.quarkus.log.category."org.ecommerce".min-level=TRACE
%dev.quarkus.log.category."org.ecommerce".level=DEBUG
%test.quarkus.log.min-level=DEBUG
%test.quarkus.log.level=INFO
%test.quarkus.log.console.level=INFO
%test.quarkus.log.category."org.ecommerce".min-level=TRACE
%test.quarkus.log.category."org.ecommerce".level=DEBUG
%prod.quarkus.log.min-level=INFO
%prod.quarkus.log.level=INFO
%prod.quarkus.log.console.level=INFO

# =====================================================================
# Hibernate ORM
# =====================================================================
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.jdbc.timezone=UTC
# Quarkus 3's key is statement-batch-size — the old jdbc.batch-size is silently ignored.
quarkus.hibernate-orm.jdbc.statement-batch-size=50
quarkus.hibernate-orm.unsupported-properties."hibernate.order_inserts"=true
quarkus.hibernate-orm.unsupported-properties."hibernate.order_updates"=true

# =====================================================================
# Auth keys (JWT)
# =====================================================================
smallrye.jwt.sign.key.location=privateKey.pem
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=http://localhost:8080

# =====================================================================
# GraphQL Configuration
# =====================================================================
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.root-path=/api/graphql
quarkus.smallrye-graphql.show-runtime-exception-message=io.quarkus.security.UnauthorizedException,io.quarkus.security.ForbiddenException,jakarta.ws.rs.NotFoundException,org.ecommerce.backend.exception.FeaturedCapExceededException,org.ecommerce.backend.exception.RateLimitExceededException,java.lang.IllegalArgumentException
quarkus.smallrye-graphql.error-extension-fields=exception,classification,code,description,validationErrorType,queryPath

# =====================================================================
# Observability
# =====================================================================
# /q/metrics, /q/health* — unauthenticated by design; restrict at the reverse
# proxy/container boundary, not in the app.
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true

# =====================================================================
# PayFast credentials
# =====================================================================
# Sandbox/live values come from env (.env locally) — these placeholders are non-secret.
payfast.merchant-id=${PAYFAST_MERCHANT_ID:placeholder-merchant-id}
payfast.merchant-key=${PAYFAST_MERCHANT_KEY:placeholder-merchant-key}
payfast.passphrase=${PAYFAST_PASSPHRASE:placeholder-passphrase}
payfast.gateway.url=${PAYFAST_GATEWAY_URL:https://sandbox.payfast.co.za/eng/process}
payfast.validate-url=${PAYFAST_VALIDATE_URL:https://sandbox.payfast.co.za/eng/query/validate}
payfast.notify-url=${PAYFAST_NOTIFY_URL:https://zacommerce.co.za/api/payments/itn}
payfast.return-url=https://zacommerce.co.za/checkout/success
payfast.cancel-url=https://zacommerce.co.za/checkout/success
# PayFast's published ITN source ranges — PayFastService.isTrustedSource rejects
# any ITN from outside them. Last confirmed 2026-08-14.
payfast.itn-allowed-ips=${PAYFAST_ITN_ALLOWED_IPS:197.97.145.144/28,41.74.179.192/27,102.216.36.0/28,102.216.36.128/28,144.126.193.139}
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
# The ITN caller is PayFast's server, not a logged-in user — PayFastResource
# itself enforces signature + source IP + amount + PayFast's own confirmation.
quarkus.http.auth.permission.payfast-itn.paths=/api/payments/itn
quarkus.http.auth.permission.payfast-itn.policy=permit
quarkus.http.auth.permission.payfast-itn.methods=POST

# =====================================================================
# Order management
# =====================================================================
# StockRecoveryJob: cancels unpaid orders older than this and returns their stock.
order.abandoned.hold-minutes=${ORDER_ABANDONED_HOLD_MINUTES:30}
# Bounds work per sweep tick; a backlog drains over successive runs.
order.abandoned.batch-size=${ORDER_ABANDONED_BATCH_SIZE:200}
# Cluster-wide sweep-lock lease — under the 5-minute schedule so a crashed
# instance's stale lock always clears before the next tick.
order.abandoned.lock-lease-seconds=${ORDER_ABANDONED_LOCK_LEASE_SECONDS:240}
# How long a checkout Idempotency-Key stays replayable (checkout-idempotency spec).
order.idempotency.replay-hours=${ORDER_IDEMPOTENCY_REPLAY_HOURS:24}
# Guest order capability token lifetime (guest-order-authorization spec).
order.capability.ttl-minutes=${ORDER_CAPABILITY_TTL_MINUTES:60}
# Fail-closed shadow-mode flag — no %test override; the suite must exercise
# the shipped end-state with enforcement on.
order.capability.enforce=${ORDER_CAPABILITY_ENFORCE:true}

# =====================================================================
# Mailer
# =====================================================================
# Mock mode logs emails instead of sending; dev defaults mocked, test always is.
%dev.quarkus.mailer.mock=${MAILER_MOCK:true}
%test.quarkus.mailer.mock=true
%prod.quarkus.mailer.mock=${MAILER_MOCK:false}
quarkus.mailer.from=${MAILER_FROM:no-reply@example.com}
quarkus.mailer.host=${MAILER_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAILER_PORT:587}
quarkus.mailer.username=${MAILER_USERNAME:}
quarkus.mailer.password=${MAILER_PASSWORD:}
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.login=REQUIRED
quarkus.log.category."io.quarkus.mailer".level=DEBUG
quarkus.mailer.*.username=${MAILER_USERNAME:}
quarkus.mailer.*.host=${MAILER_HOST:smtp.gmail.com}
quarkus.mailer.*.port=${MAILER_PORT:587}
quarkus.mailer.*.from=${MAILER_FROM:no-reply@example.com}

# =====================================================================
# Admin bootstrap & password reset
# =====================================================================
# Seeded on first boot when no staff exists.
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin@example.com}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:Admin@123}
# HMAC-keyed OTP hash, not a bare digest — no usable default; every non-dev/test
# environment must set PASSWORD_RESET_HMAC_SECRET explicitly.
password-reset.code.hmac-secret=${PASSWORD_RESET_HMAC_SECRET}
%dev.password-reset.code.hmac-secret=dev-only-insecure-hmac-secret-do-not-use-in-production
%test.password-reset.code.hmac-secret=test-only-hmac-secret-not-for-production


quarkus.health.readiness.checks."redis".enabled=false
quarkus.health.enabled=false

# =====================================================================
# Image storage
# =====================================================================
storage.path=${IMAGE_STORAGE_PATH:/tmp/images}
quarkus.http.static-resources.index-page=index.html

# =====================================================================
# Rate limiting
# =====================================================================
# ratelimit.<name>.max/.window-seconds override the code-level default at each
# call site; ratelimit.default.* is the shared fallback used by tests.
ratelimit.enquiry.max=${ENQUIRY_RATE_LIMIT_MAX:5}
ratelimit.enquiry.window-seconds=${ENQUIRY_RATE_LIMIT_WINDOW:3600}
%test.ratelimit.default.max=100000
%test.ratelimit.default.window-seconds=2
%test.ratelimit.wholesale-application.max=2
%test.ratelimit.wholesale-application.window-seconds=2
%test.ratelimit.admin-login.max=3
%test.ratelimit.admin-login.window-seconds=2
%test.quarkus.scheduler.enabled=false
%test.order.abandoned.hold-minutes=525600
