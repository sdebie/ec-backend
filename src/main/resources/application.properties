# =====================================================================
# Database Configuration (Parameterized for Docker Environment Overrides)
# =====================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:postgres}

# Drop-and-create or update strategies for Demo instances
quarkus.hibernate-orm.log.sql=${LOG_SQL:false}


# HTTP Port Settings
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
# CORS origins — locked per profile (auth-hardening REQ 1).
# Dev/test: Vite dev server runs on port 3000 (vite.config.ts server.port), proxying /api to :8080;
# a same-origin POST still sends Origin: http://localhost:3000, which the proxy forwards to the backend.
# Prod: explicit env var, no wildcard fallback.
%dev.quarkus.http.cors.origins=http://localhost:3000
%test.quarkus.http.cors.origins=http://localhost:3000
%prod.quarkus.http.cors.origins=${CORS_ORIGINS}

# Rest Countries proxy (server-side call to avoid browser CORS Authorization limits)
restcountries.api.base-url=${RESTCOUNTRIES_API_BASE_URL:https://api.restcountries.com/countries/v5}
restcountries.api.key=${RESTCOUNTRIES_API_KEY:}


# Logging
quarkus.console.color=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{node}] %-5p %t %F:%L | %m%n
quarkus.log.min-level=DEBUG
# Enable DEBUG logs to show in console
quarkus.log.level=INFO
quarkus.log.console.level=DEBUG

# Hibernate GeneralSettings
quarkus.hibernate-orm.database.generation=none
# (log.sql is configured once above via ${LOG_SQL:false} — do not redefine it here.)
# This is important for UUID support in Hibernate Reactive
quarkus.hibernate-orm.jdbc.timezone=UTC
# Batched inserts/updates. In Quarkus 3 the key is statement-batch-size; the old
# `jdbc.batch-size` / `log.jdbc.batch-size-skip-warnings` keys were unrecognized (ignored).
quarkus.hibernate-orm.jdbc.statement-batch-size=50
# order_inserts/order_updates are native Hibernate properties with no first-class
# Quarkus key — pass them through the sanctioned escape hatch so batching stays ordered.
quarkus.hibernate-orm.unsupported-properties."hibernate.order_inserts"=true
quarkus.hibernate-orm.unsupported-properties."hibernate.order_updates"=true

# Bulk image uploads can exceed the default 10 MB request limit.
quarkus.http.limits.max-body-size=100M

quarkus.http.cors.enabled=true
quarkus.http.cors.access-control-allow-credentials=true

##Staff Roles
# For generating tokens (The Private Key)
smallrye.jwt.sign.key.location=privateKey.pem
# For verifying tokens on protected resources (The Public Key)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=http://localhost:8080

# GraphQL config
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.root-path=/api/graphql
quarkus.smallrye-graphql.show-runtime-exception-message=io.quarkus.security.UnauthorizedException,io.quarkus.security.ForbiddenException,jakarta.ws.rs.NotFoundException,org.ecommerce.backend.service.FeaturedCapExceededException
quarkus.smallrye-graphql.error-extension-fields=exception,classification,code,description,validationErrorType,queryPath

# Production telemetry. Prometheus scrapes /q/metrics; keep that endpoint
# network-restricted at the reverse proxy/container boundary.
# Quarkus supplies HTTP request count, duration and status metrics automatically.
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true

