# Gmail SMTP GeneralSettings
quarkus.mailer.mock=false
# Sender address, SMTP username and the 16-character Gmail APP PASSWORD are
# supplied via environment variables — NEVER commit real credentials here.
# Non-secret placeholder default — override MAILER_FROM in every real environment.
# Must be non-empty: quarkus.mailer.from is a required property and SmallRye rejects "".
quarkus.mailer.from=${MAILER_FROM:no-reply@example.com}
quarkus.mailer.host=${MAILER_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAILER_PORT:587}
quarkus.mailer.username=${MAILER_USERNAME:}
quarkus.mailer.password=${MAILER_PASSWORD:}
# Quarkus 3 key names — the old `starttls` / `auth-mechanisms` were unrecognized
# (ignored), so STARTTLS was NOT actually being enforced.
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.login=REQUIRED

quarkus.log.category."io.quarkus.mailer".level=DEBUG

quarkus.mailer.*.username=${MAILER_USERNAME:}
quarkus.mailer.*.host=${MAILER_HOST:smtp.gmail.com}
quarkus.mailer.*.port=${MAILER_PORT:587}
quarkus.mailer.*.from=${MAILER_FROM:no-reply@example.com}

#Image Upload Path
# Path inside the container where the volume is mounted
storage.path=${IMAGE_STORAGE_PATH:/tmp/images}

# Map a URL path to the physical file system
quarkus.http.static-resources.index-page=index.html

