# =====================================================================
# Database Configuration (Parameterized for Docker Environment Overrides)
# =====================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/ecommerce_db}
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:postgres}
# Drop-and-create or update strategies for Demo instances
quarkus.hibernate-orm.log.sql=${LOG_SQL:false}
# HTTP Port Settings
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
# CORS origins — locked per profile (auth-hardening REQ 1).
# Dev/test: Vite dev server runs on port 3000 (vite.config.ts server.port), proxying /api to :8080;
# a same-origin POST still sends Origin: http://localhost:3000, which the proxy forwards to the backend.
# Prod: explicit env var, no wildcard fallback.
%dev.quarkus.http.cors.origins=http://localhost:3000
%test.quarkus.http.cors.origins=http://localhost:3000
%prod.quarkus.http.cors.origins=${CORS_ORIGINS}
# Rest Countries proxy (server-side call to avoid browser CORS Authorization limits)
restcountries.api.base-url=${RESTCOUNTRIES_API_BASE_URL:https://api.restcountries.com/countries/v5}
restcountries.api.key=${RESTCOUNTRIES_API_KEY:}
# Storefront origin, for links embedded in outbound email (password reset, wholesale decisions).
# Dev default matches Vite's configured port (vite.config.ts server.port); prod must set the env var.
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
# Logging
quarkus.console.color=true
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} [%X{node}] %-5p %t %F:%L | %m%n
# dev/test stay verbose for local debugging and CI diagnostics; prod must not run at DEBUG
%dev.quarkus.log.min-level=DEBUG
%dev.quarkus.log.level=DEBUG
%dev.quarkus.log.console.level=DEBUG
%test.quarkus.log.min-level=DEBUG
%test.quarkus.log.level=DEBUG
%test.quarkus.log.console.level=DEBUG
%prod.quarkus.log.min-level=INFO
%prod.quarkus.log.level=INFO
%prod.quarkus.log.console.level=INFO
# Hibernate GeneralSettings
quarkus.hibernate-orm.database.generation=none
# (log.sql is configured once above via ${LOG_SQL:false} — do not redefine it here.)
# This is important for UUID support in Hibernate Reactive
quarkus.hibernate-orm.jdbc.timezone=UTC
# Batched inserts/updates. In Quarkus 3 the key is statement-batch-size; the old
# `jdbc.batch-size` / `log.jdbc.batch-size-skip-warnings` keys were unrecognized (ignored).
quarkus.hibernate-orm.jdbc.statement-batch-size=50
# order_inserts/order_updates are native Hibernate properties with no first-class
# Quarkus key — pass them through the sanctioned escape hatch so batching stays ordered.
quarkus.hibernate-orm.unsupported-properties."hibernate.order_inserts"=true
quarkus.hibernate-orm.unsupported-properties."hibernate.order_updates"=true
# Bulk image uploads can exceed the default 10 MB request limit.
quarkus.http.limits.max-body-size=100M
quarkus.http.cors.enabled=true
quarkus.http.cors.access-control-allow-credentials=true
##Staff Roles
# For generating tokens (The Private Key)
smallrye.jwt.sign.key.location=privateKey.pem
# For verifying tokens on protected resources (The Public Key)
mp.jwt.verify.publickey.location=publicKey.pem
mp.jwt.verify.issuer=http://localhost:8080
# GraphQL config
quarkus.smallrye-graphql.ui.always-include=true
quarkus.smallrye-graphql.root-path=/api/graphql
quarkus.smallrye-graphql.show-runtime-exception-message=io.quarkus.security.UnauthorizedException,io.quarkus.security.ForbiddenException,jakarta.ws.rs.NotFoundException,org.ecommerce.backend.exception.FeaturedCapExceededException,org.ecommerce.backend.exception.RateLimitExceededException,java.lang.IllegalArgumentException
quarkus.smallrye-graphql.error-extension-fields=exception,classification,code,description,validationErrorType,queryPath
# Production telemetry. Prometheus scrapes /q/metrics; keep that endpoint
# network-restricted at the reverse proxy/container boundary.
# Quarkus supplies HTTP request count, duration and status metrics automatically.
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.http-server.enabled=true
# PayFast credentials — sandbox/live values come from env (ec-backend/.env locally); placeholders are non-secret.
payfast.merchant-id=${PAYFAST_MERCHANT_ID:placeholder-merchant-id}
payfast.merchant-key=${PAYFAST_MERCHANT_KEY:placeholder-merchant-key}
payfast.passphrase=${PAYFAST_PASSPHRASE:placeholder-passphrase}
payfast.gateway.url=${PAYFAST_GATEWAY_URL:https://sandbox.payfast.co.za/eng/process}
payfast.validate-url=${PAYFAST_VALIDATE_URL:https://sandbox.payfast.co.za/eng/query/validate}
payfast.notify-url=${PAYFAST_NOTIFY_URL:https://zacommerce.co.za/api/payments/itn}
# guest-order-authorization Requirement 6.5/task 6.4: neither /payment-success nor
# /payment-cancelled is a route router.tsx defines — only /checkout/success. A static
# return_url can't carry an order id, which is why the old ?sessionId= shape could
# never have survived a gateway redirect; the success page now reads the order from
# checkoutSessionStore (which survives the round trip in the same tab), so pointing
# at the existing route is sufficient.
payfast.return-url=https://zacommerce.co.za/checkout/success
payfast.cancel-url=https://zacommerce.co.za/checkout/success
# PayFast's published ITN source ranges (https://developers.payfast.co.za — "Ports and IP
# addresses"; last confirmed 2026-08-14). Update this if PayFast ever announces a change —
# PayFastService.isTrustedSource rejects any ITN whose resolved client IP falls outside it.
payfast.itn-allowed-ips=${PAYFAST_ITN_ALLOWED_IPS:197.97.145.144/28,41.74.179.192/27,102.216.36.0/28,102.216.36.128/28,144.126.193.139}
# Trust the Cloudflare proxy headers
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
# The ITN endpoint is necessarily open to anonymous POSTs (PayFast is a server, not a
# logged-in user) — PayFastResource.handleITN is the enforcement point instead, gating on
# signature + source IP + amount match + PayFast's own server-side confirmation.
quarkus.http.auth.permission.payfast-itn.paths=/api/payments/itn
quarkus.http.auth.permission.payfast-itn.policy=permit
quarkus.http.auth.permission.payfast-itn.methods=POST
# Abandoned-order stock recovery — StockRecoveryJob cancels CREATED orders
# (checkout started, stock already decremented, never paid) older than this and
# returns their stock to sale. Real commitments (IN_STORE_PAYMENT, PAID, ...)
# are never touched.
order.abandoned.hold-minutes=${ORDER_ABANDONED_HOLD_MINUTES:30}
# How many abandoned orders one sweep may release. Bounds the work per tick so a
# backlog drains over successive runs instead of in one oversized pass; each order
# commits on its own, so a partial sweep is progress, not a half-finished unit.
order.abandoned.batch-size=${ORDER_ABANDONED_BATCH_SIZE:200}
# How long a checkout Idempotency-Key stays replayable, measured from the matched
# order's created_at. The key itself never expires and is never reused — only the
# replay is bounded (.kiro/specs/checkout-idempotency, Requirement 5).
order.idempotency.replay-hours=${ORDER_IDEMPOTENCY_REPLAY_HOURS:24}
# Order capability token lifetime (.kiro/specs/guest-order-authorization, Requirement
# 2.3) — a self-contained, signed capability bound to one order id, minted at checkout
# and required by every order-scoped surface. 60 minutes bounds read exposure past the
# 30-minute abandoned-order hold above; it does not gate reads at all (Requirement 2.8).
order.capability.ttl-minutes=${ORDER_CAPABILITY_TTL_MINUTES:60}
# Separates minting/shadow-mode (release 1) from enforcement (release 2) — defaults to
# true (fail closed); release 1 overrides this to false in its environment only, and
# release 2 removes that override. Deleted entirely once release 2 is established
# (guest-order-authorization, Requirement 6.0). Do not set a %test override: the suite
# must exercise the shipped end-state with enforcement on.
order.capability.enforce=${ORDER_CAPABILITY_ENFORCE:true}
# Gmail SMTP GeneralSettings
# Mock mode: when true, emails are NOT sent — they are logged (full-rendered message)
# and collected in MockMailbox instead. dev defaults to mock, so local testing never
# emails real inboxes; set MAILER_MOCK=false in dev to exercise real SMTP delivery.
# test is always mocked (never overridable). prod sends for real unless MAILER_MOCK=true.
%dev.quarkus.mailer.mock=${MAILER_MOCK:true}
%test.quarkus.mailer.mock=true
%prod.quarkus.mailer.mock=${MAILER_MOCK:false}
# Sender address, SMTP username and the 16-character Gmail APP PASSWORD are
# supplied via environment variables — NEVER commit real credentials here.
# Non-secret placeholder default — override MAILER_FROM in every real environment.
# Must be non-empty: quarkus.mailer.from is a required property and SmallRye rejects "".
quarkus.mailer.from=${MAILER_FROM:no-reply@example.com}
quarkus.mailer.host=${MAILER_HOST:smtp.gmail.com}
quarkus.mailer.port=${MAILER_PORT:587}
quarkus.mailer.username=${MAILER_USERNAME:}
quarkus.mailer.password=${MAILER_PASSWORD:}
# Quarkus 3 key names — the old `starttls` / `auth-mechanisms` were unrecognized
# (ignored), so STARTTLS was NOT actually being enforced.
quarkus.mailer.start-tls=REQUIRED
quarkus.mailer.login=REQUIRED
quarkus.log.category."io.quarkus.mailer".level=DEBUG
quarkus.mailer.*.username=${MAILER_USERNAME:}
quarkus.mailer.*.host=${MAILER_HOST:smtp.gmail.com}
quarkus.mailer.*.port=${MAILER_PORT:587}
quarkus.mailer.*.from=${MAILER_FROM:no-reply@example.com}
# Bootstrap admin identity — seeded on first boot when no staff exists.
admin.bootstrap.email=${ADMIN_BOOTSTRAP_EMAIL:admin@example.com}
admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:Admin@123}
# Password-reset OTP codes (customer + staff, shared PasswordResetCodePolicy) are stored
# as HMAC-SHA256 keyed by this secret, not a bare digest — anyone with a database read
# but not this secret cannot brute-force a live code. Deliberately NO production-usable
# default: every non-dev/test environment must set PASSWORD_RESET_HMAC_SECRET explicitly.
password-reset.code.hmac-secret=${PASSWORD_RESET_HMAC_SECRET}
%dev.password-reset.code.hmac-secret=dev-only-insecure-hmac-secret-do-not-use-in-production
%test.password-reset.code.hmac-secret=test-only-hmac-secret-not-for-production
#Image Upload Path inside the container where the volume is mounted
storage.path=${IMAGE_STORAGE_PATH:/tmp/images}
# Map a URL path to the physical file system
quarkus.http.static-resources.index-page=index.html
# Rate limiting — all limiters: rate limit.<name>.max / rate limit.<name>.window-seconds.
# Defaults live in code at each call site (a deliberate per-endpoint security decision —
# e.g. login gets a tighter limit than checkout); these keys exist for operator override
# via env vars. Only `enquiry` has one today.
ratelimit.enquiry.max=${ENQUIRY_RATE_LIMIT_MAX:5}
ratelimit.enquiry.window-seconds=${ENQUIRY_RATE_LIMIT_WINDOW:3600}
%test.ratelimit.default.max=100000
%test.ratelimit.default.window-seconds=2
%test.ratelimit.wholesale-application.max=2
%test.ratelimit.wholesale-application.window-seconds=2
%test.ratelimit.admin-login.max=3
%test.ratelimit.admin-login.window-seconds=2
%test.quarkus.scheduler.enabled=false
%test.order.abandoned.hold-minutes=525600
