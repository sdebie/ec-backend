name: Build and Push Quarkus Backend

on:
  push:
    branches:
      - main  # Automatically compiles and ships your code every time you push to main

# Force JavaScript actions to use Node.js 24 to silence deprecation warnings in 2026
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  compile-and-ship:
    runs-on: ubuntu-latest

    # Essential permissions to allow this repo to pull down packages from your other repo
    permissions:
      contents: read
      packages: read

    steps:
      # 1. Download the backend source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 21 with automatic Maven build caching
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # 3. Inject authentication credentials into Maven so it can download parent/common packages
      - name: Configure Maven for GitHub Packages Auth
        uses: s4u/maven-settings-action@v4
        with:
          servers: |
            [
              {
                "id": "github-parent",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              },
              {
                "id": "github-common",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              }
            ]

      # 4. Compile the backend application. Maven will safely pull parent/common packages from GitHub Packages.
      - name: Compile Application with Maven
        run: mvn clean package -DskipTests

      # 5. Log in securely to your Docker Hub account
      - name: Authenticate with Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Build the lightweight production image and push it to Docker Hub
      - name: Build and Push Final Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runtime
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ec-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ec-backend:${{ github.sha }}