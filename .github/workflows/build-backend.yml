name: Finalize Release and Build Backend

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # -------------------------------------------------------------
  # Job 2: Build & Push Docker Image (Runs ONLY after Job 1 succeeds)
  # -------------------------------------------------------------
  compile-and-ship:
#    needs: strip-snapshot
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      # Checkout main to ensure we get the cleaned release POM version from Job 1
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven for GitHub Packages Auth
        uses: s4u/maven-settings-action@v4.0.0
        with:
          servers: |
            [
              {
                "id": "github-parent",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              },
              {
                "id": "github-common",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              },
              {
                "id": "github-infra",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              }
            ]

      - name: Compile Application with Maven
        run: mvn clean package -DskipTests

      - name: Authenticate with Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Final Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.runtime
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ec-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ec-backend:${{ github.sha }}