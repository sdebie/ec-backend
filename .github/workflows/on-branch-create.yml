name: Setup Feature Branch Snapshot Version

on:
  create:

jobs:
  bump-snapshot:
    # Only run when a branch (not a tag) is created, and ignore main
    if: github.event.ref_type == 'branch' && github.event.ref != 'main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Maven Auth so help:evaluate and versions:set can resolve parent/common dependencies
      - name: Configure Maven for GitHub Packages Auth
        uses: s4u/maven-settings-action@v4.0.0
        with:
          servers: |
            [
              {
                "id": "github-parent",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              },
              {
                "id": "github-common",
                "username": "${{ github.actor }}",
                "password": "${{ secrets.GITHUB_TOKEN }}"
              }
            ]

      - name: Set Next SNAPSHOT Version
        run: |
          CURRENT_VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)
          
          # Only bump if the branch currently doesn't already have -SNAPSHOT
          if [[ "$CURRENT_VERSION" != *"-SNAPSHOT"* ]]; then
            echo "Bumping version $CURRENT_VERSION to next SNAPSHOT..."
            mvn -B versions:set -DnextSnapshot=true -DgenerateBackupPoms=false
          
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
          
            # Prevent exit code 1 if git status is clean
            if [[ -n $(git status --porcelain) ]]; then
              git commit -am "chore(version): set feature branch snapshot version [skip ci]"
              # Explicitly push HEAD to the created branch ref
              git push origin HEAD:${{ github.event.ref }}
            else
              echo "No version changes detected to commit."
            fi
          else
            echo "Version is already a SNAPSHOT ($CURRENT_VERSION). Skipping bump."
          fi